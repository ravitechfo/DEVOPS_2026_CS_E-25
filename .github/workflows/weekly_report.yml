name: Automated Saturday Weekly Progress Report

on:
  # Runs every Saturday at 23:59 IST (18:29 UTC)
  schedule:
    - cron: '29 18 * * 6'
  # Allows manual triggering from GitHub Actions tab anytime
  workflow_dispatch:
    inputs:
      interval:
        description: 'Report Type (weekly / monthly / final)'
        required: true
        default: 'weekly'
        type: choice
        options:
          - weekly
          - monthly
          - final

permissions:
  contents: write

jobs:
  generate-and-commit-report:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository (Full Git History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Crucial: fetch all commits for accurate git log metrics

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab matplotlib

      - name: 📄 Generate Progress Report PDF
        run: |
          INTERVAL="${{ github.event.inputs.interval || 'weekly' }}"
          echo "Generating $INTERVAL report..."
          python generate_report.py "$INTERVAL"

      - name: 📤 Upload PDF as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-progress-report
          path: "*.pdf"

      - name: 🚀 Commit and Push Generated PDF to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.pdf
          
          # Only commit if a new or updated PDF was created
          if git diff --staged --quiet; then
            echo "No new PDF changes to commit."
          else
            git commit -m "📊 Automated Weekly Progress Report [$(date +'%Y-%m-%d')]"
            git push origin main || git push
          fi
