apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-campus-backend
  namespace: smart-campus
  labels:
    app: smart-campus-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-campus-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: smart-campus-backend
    spec:
      containers:
        - name: backend
          image: smart-campus-backend:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: smart-campus-config
            - secretRef:
                name: smart-campus-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: smart-campus
  labels:
    app: smart-campus-backend
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  selector:
    app: smart-campus-backend
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: smart-campus
  labels:
    app: smart-campus-backend
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  selector:
    app: smart-campus-backend
