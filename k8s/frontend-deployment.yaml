apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-campus-frontend
  namespace: smart-campus
  labels:
    app: smart-campus-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-campus-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: smart-campus-frontend
    spec:
      containers:
        - name: frontend
          image: smart-campus-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: smart-campus
  labels:
    app: smart-campus-frontend
spec:
  type: LoadBalancer
  ports:
    - port: 8080
      targetPort: 80
      name: http
  selector:
    app: smart-campus-frontend
